version: 0.2

phases:
  install:
    commands:
      # Install Terraform if it's not pre-installed in your CodeBuild environment
      - wget https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
      - unzip terraform_1.13.3_linux_amd64.zip
      - mv terraform /usr/local/bin/
  pre_build:
    commands:
      # Use an environment variable for the backend S3 bucket name
      - terraform init -backend-config="bucket=$TF_STATE_BUCKET"
      - |
        # Only empty WEBSITE_BUCKET if it's set and the bucket exists
        if [[ -n "${WEBSITE_BUCKET}" ]] && aws s3api head-bucket --bucket "$WEBSITE_BUCKET" >/dev/null 2>&1; then
          echo "Emptying $WEBSITE_BUCKET"
          aws s3 rm s3://"$WEBSITE_BUCKET" --recursive
        else
          echo "Skipping WEBSITE_BUCKET (not set or does not exist): ${WEBSITE_BUCKET:-<unset>}"
        fi
      - |
        # Only empty ARTIFACTS_BUCKET if it's set and the bucket exists
        if [[ -n "${ARTIFACTS_BUCKET}" ]] && aws s3api head-bucket --bucket "$ARTIFACTS_BUCKET" >/dev/null 2>&1; then
          echo "Emptying $ARTIFACTS_BUCKET"
          aws s3 rm s3://"$ARTIFACTS_BUCKET" --recursive
        else
          echo "Skipping ARTIFACTS_BUCKET (not set or does not exist): ${ARTIFACTS_BUCKET:-<unset>}"
        fi
      - |
        # Only empty LAMBDA_BUCKET if it's set and the bucket exists
        if [[ -n "${LAMBDA_BUCKET}" ]] && aws s3api head-bucket --bucket "$LAMBDA_BUCKET" >/dev/null 2>&1; then
          echo "Emptying $LAMBDA_BUCKET"
          aws s3 rm s3://"$LAMBDA_BUCKET" --recursive
        else
          echo "Skipping LAMBDA_BUCKET (not set or does not exist): ${LAMBDA_BUCKET:-<unset>}"
        fi
  build:
    commands:
      # Run the destroy command
      - terraform destroy -auto-approve
